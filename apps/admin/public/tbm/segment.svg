      const segments = [
      {key:"A",color:"#F59E0B",start:"08:00",end:"10:30"},
      {key:"B",color:"#3B82F6",start:"10:30",end:"12:00"},
      {key:"C",color:"#10B981",start:"12:00",end:"13:30"},
      {key:"D",color:"#6B7280",start:"13:30",end:"15:00"},
      {key:"E",color:"#EF4444",start:"15:00",end:"16:30"},
      ]

      const timeToAngle = (time:string) => {
        const [hours, minutes] = time.split(':').map(Number);
        const totalMinutes = hours * 60 + minutes;
        return (totalMinutes / (24 * 60)) * 360; // Convert to degrees
      };

      const polarToCartesian = (cx: number, cy: number, radius: number, angle: number) => {
        const radian = (angle - 90) * (Math.PI / 180); // Adjust for SVG coordinate system
        return {
          x: cx + radius * Math.cos(radian),
          y: cy + radius * Math.sin(radian),
        };
      };

      <svg
        className="stroke-gray-400 w-full h-full"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="50" cy="50" r="49" stroke="#1E3A8A" strokeWidth="2" fill="none" />
        {segments.map((segment) => {
          const startAngle = timeToAngle(segment.start);
          const endAngle = timeToAngle(segment.end);
          const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

          const start = polarToCartesian(50, 50, 49, endAngle);
          const end = polarToCartesian(50, 50, 49, startAngle);

          const pathData = `M ${start.x} ${start.y} A 49 49 0 ${largeArcFlag} 0 ${end.x} ${end.y} L 50 50 Z`;

          return (
            <path
              key={segment.key}
              d={pathData}
              fill={segment.color}
              stroke="#1E3A8A"
            />
          );
        })}

</svg>
